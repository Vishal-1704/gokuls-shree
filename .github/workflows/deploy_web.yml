name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env is gitignored (it's not committed on purpose, even though none
      # of these values are actually secret — the anon key is designed to be
      # public) but pubspec.yaml bundles it as a required asset, so the web
      # build fails without it. Reconstruct it here before building.
      - name: Create .env
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://iaxilajyxsijoeujcbfv.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlheGlsYWp5eHNpam9ldWpjYmZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjI0MjIsImV4cCI6MjEwMDg5ODQyMn0.ssYkAGWhnl4TwInKQnEKCpCohPQl13CU9L0Qqw4Su2g
          API_BASE_URL=https://gokulshree-backend-860363218365.us-central1.run.app/api/v1
          API_TIMEOUT_SECONDS=30
          APP_NAME=Gokulshree School Of Management And Technology Pvt Ltd
          APP_VERSION=1.0.0
          DEBUG_MODE=false
          WEBSITE_BASE_URL=https://gokulshreeschool.com
          EOF

      - name: Build web release
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: task-433706
          channelId: live
          target: gokulshree-app
