name: Build & Release Flutter App

on:
  push:
    branches:
      - main
    # To trigger on tags instead of every push to main, comment out branches above and uncomment below:
    # tags:
    #   - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Full tag history is required — Generate Release Tag below reads
          # every existing tag to compute the next version. A shallow
          # checkout (actions/checkout's default) only fetches the current
          # commit and no tags at all.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # pubspec.yaml requires .env as a bundled asset (flutter_dotenv), but
      # .env is gitignored (it holds live Supabase keys) so a fresh CI
      # checkout never has one — the build fails at the asset-bundling step
      # with "No file or variants found for asset: .env" before it ever
      # gets to compiling anything. Requires a one-time repo secret named
      # ENV_FILE containing the exact real .env file's full contents
      # (Settings -> Secrets and variables -> Actions -> New repository
      # secret) — this workflow cannot invent real Supabase credentials.
      - name: Write .env file
        run: |
          cat > .env << 'ENVEOF'
          ${{ secrets.ENV_FILE }}
          ENVEOF

      # android/.gitignore excludes **/*.jks (android/app/key.jks is the
      # real release-signing keystore, correctly never committed), so a
      # fresh CI checkout has no keystore for the "release" signing config
      # in android/app/build.gradle.kts — the build fails at
      # :app:validateSigningRelease with "Keystore file ... not found".
      # Requires a one-time repo secret named KEYSTORE_BASE64 containing
      # the real key.jks file, base64-encoded.
      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks

      - name: Generate Release Tag
        id: tag
        # Semantic X.Y.Z tags, auto-incrementing the patch on every push to
        # main. Manually pushing a bare "X.Y" tag (e.g. `git tag 2.3 &&
        # git push origin 2.3`) resets the baseline — the next auto-build
        # becomes X.Y.1, then X.Y.2, etc. This replaces the old
        # timestamp-based tag (vYYYY.MM.DD-HHMM), which caused "Cannot
        # upload assets to an immutable release" (422) whenever two runs
        # landed in the same minute and generated an identical tag.
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Highest existing full release tag (X.Y.Z), if any.
          latest_release=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 || true)

          # Highest manually-pushed bare baseline tag (X.Y), if any.
          latest_baseline=$(git tag -l | grep -E '^[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n | tail -n1 || true)

          if [ -n "$latest_baseline" ]; then
            baseline_release="${latest_baseline}.0"
            # Is the manual baseline strictly newer than the latest full
            # release? Compare as version strings via sort -V so "2.3.0"
            # correctly outranks "2.1.9", not just a plain string compare.
            baseline_wins=false
            if [ -z "$latest_release" ]; then
              baseline_wins=true
            elif [ "$baseline_release" != "$latest_release" ]; then
              highest=$(printf '%s\n%s\n' "$baseline_release" "$latest_release" | sort -V | tail -n1)
              if [ "$highest" = "$baseline_release" ]; then
                baseline_wins=true
              fi
            fi
            if [ "$baseline_wins" = true ]; then
              latest_release="$baseline_release"
            fi
          fi

          if [ -z "$latest_release" ]; then
            # First-ever run under this scheme — no X.Y.Z or X.Y tags exist.
            next_version="2.3.1"
          else
            major=$(echo "$latest_release" | cut -d. -f1)
            minor=$(echo "$latest_release" | cut -d. -f2)
            patch=$(echo "$latest_release" | cut -d. -f3)
            next_version="${major}.${minor}.$((patch + 1))"
          fi

          # A tag can exist without ever having a completed release attached
          # (e.g. a prior run created the tag, then failed before/during
          # upload) — softprops/action-gh-release then hits "Cannot upload
          # assets to an immutable release" (422) trying to reuse it. Rather
          # than fail the whole workflow on that, skip forward past every
          # tag that already exists (checked via `git tag -l`, not
          # `git rev-parse`, since the latter also matches branches/commits)
          # until we land on a genuinely free one.
          while git tag -l "$next_version" | grep -qx "$next_version"; do
            echo "Tag $next_version already exists (no completed release) — skipping to the next patch."
            major=$(echo "$next_version" | cut -d. -f1)
            minor=$(echo "$next_version" | cut -d. -f2)
            patch=$(echo "$next_version" | cut -d. -f3)
            next_version="${major}.${minor}.$((patch + 1))"
          done

          echo "tag_name=$next_version" >> $GITHUB_ENV
          echo "version_name=$next_version" >> $GITHUB_ENV
          # versionCode must stay under Android's hard ceiling of
          # 2100000000 — a YYYYMMDDHHMM stamp is 12 digits and blows past
          # that immediately. Unix epoch seconds is ~1.7-1.8 billion today,
          # still monotonically increasing release over release, and won't
          # hit the ceiling until ~2036.
          echo "build_number=$(date +%s)" >> $GITHUB_ENV

      - name: Build APK
        # --build-name is embedded as the APK's own versionName, which the
        # in-app update check compares directly against this same release's
        # tag_name (update_service.dart strips any leading "v", a no-op now
        # that tags are plain X.Y.Z) — they must come from the same value
        # for that comparison to be meaningful. --build-number must
        # strictly increase release over release or Android refuses to
        # install the new APK as an update over what's already installed.
        run: |
          flutter build apk --release --android-skip-build-dependency-validation \
            --build-name=${{ env.version_name }} --build-number=${{ env.build_number }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.tag_name }}
          name: Release ${{ env.tag_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
