name: Build & Release Flutter App

on:
  push:
    branches:
      - main
    # To trigger on tags instead of every push to main, comment out branches above and uncomment below:
    # tags:
    #   - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # pubspec.yaml requires .env as a bundled asset (flutter_dotenv), but
      # .env is gitignored (it holds live Supabase keys) so a fresh CI
      # checkout never has one — the build fails at the asset-bundling step
      # with "No file or variants found for asset: .env" before it ever
      # gets to compiling anything. Requires a one-time repo secret named
      # ENV_FILE containing the exact real .env file's full contents
      # (Settings -> Secrets and variables -> Actions -> New repository
      # secret) — this workflow cannot invent real Supabase credentials.
      - name: Write .env file
        run: |
          cat > .env << 'ENVEOF'
          ${{ secrets.ENV_FILE }}
          ENVEOF

      # android/.gitignore excludes **/*.jks (android/app/key.jks is the
      # real release-signing keystore, correctly never committed), so a
      # fresh CI checkout has no keystore for the "release" signing config
      # in android/app/build.gradle.kts — the build fails at
      # :app:validateSigningRelease with "Keystore file ... not found".
      # Requires a one-time repo secret named KEYSTORE_BASE64 containing
      # the real key.jks file, base64-encoded.
      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks

      - name: Generate Release Tag
        id: tag
        run: |
          version_stamp=$(date +'%Y.%m.%d-%H%M')
          echo "tag_name=v$version_stamp" >> $GITHUB_ENV
          echo "version_name=$version_stamp" >> $GITHUB_ENV
          # versionCode must stay under Android's hard ceiling of
          # 2100000000 — a YYYYMMDDHHMM stamp is 12 digits and blows past
          # that immediately. Unix epoch seconds is ~1.7-1.8 billion today,
          # still monotonically increasing release over release, and won't
          # hit the ceiling until ~2036.
          echo "build_number=$(date +%s)" >> $GITHUB_ENV

      - name: Build APK
        # --build-name is embedded as the APK's own versionName, which the
        # in-app update check compares directly against this same release's
        # tag_name (with its leading "v" stripped, same as update_service.dart
        # does at runtime) — they must come from the same value for that
        # comparison to be meaningful. --build-number must strictly increase
        # release over release or Android refuses to install the new APK as
        # an update over what's already installed.
        run: |
          flutter build apk --release --android-skip-build-dependency-validation \
            --build-name=${{ env.version_name }} --build-number=${{ env.build_number }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.tag_name }}
          name: Release ${{ env.tag_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
